services:
  - type: web
    name: quantlab-pro-paper
    runtime: docker
    dockerfilePath: ./Dockerfile.web
    plan: starter
    healthCheckPath: /_stcore/health
    envVars:
      - key: QUANT_ADMIN_TOKEN
        generateValue: true
      - key: QUANT_DB
        value: /data/quantlab.db
    disk:
      name: quantlab-data
      mountPath: /data
      sizeGB: 1
